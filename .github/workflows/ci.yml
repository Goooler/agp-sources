name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  dump-sources:
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'Goooler/agp-sources' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - name: Remove outdated sources and dump new sources
        run: |
          rm -rf *-alpha* # Remove the last alpha version sources.
          rm -rf *-rc* # Remove the last rc version sources.
          ./gradlew dumpAgpSources
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # TODO: https://github.com/peter-evans/create-pull-request/issues/4111
      - uses: goooler/create-pull-request@a6ce27dbae568ca4608156da749e7f02f4ed1e4d
        id: create-pull-request
        with:
          commit-message: |
            Update AGP sources to the latest

            _Auto-generated by `dump-sources` workflow._
          branch: actions/dump-sources
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com> # Same as `committer`.'
          token: ${{ steps.app-token.outputs.token }}
          delete-branch: true
      - name: Merge Pull Request
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token will not trigger workflows run, which is desired here.
        run: |
          gh pr merge ${{ steps.create-pull-request.outputs.pull-request-number }} --auto --rebase
